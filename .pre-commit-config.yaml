# Pre-commit hooks for the biped project.
# - C++  : clang-format (uses the repo-root .clang-format)
# - Python: black + isort
# third_party/, build/, install/, log/ are excluded everywhere.
exclude: |
  (?x)^(
      third_party/.* |
      build/.* |
      install/.* |
      log/.* |
      \.git/.*
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v14.0.0
    hooks:
      - id: clang-format
        args: [--style=file, -i]

  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--config=pyproject.toml]
